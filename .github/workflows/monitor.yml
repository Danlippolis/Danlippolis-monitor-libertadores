name: monitor-ingressos #teste_exec

# Disparado a cada 10 min pelo cron-job.org (API workflow_dispatch).
# O agendamento nativo do GitHub foi removido: demorou ~19h para disparar a primeira vez
# e, rodando junto com o cron-job.org, gerava execuções duplicadas e conflito no push do estado.
on:
  workflow_dispatch:          # cron-job.org + botão "Run workflow"

permissions:
  contents: write             # para commitar o state.json

concurrency:
  group: monitor-ingressos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # sempre a versão mais recente (inclui o state.json salvo pela execução anterior)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: atualiza estado do monitor"
            # Se outra execução salvou o estado no meio-tempo, reaplica por cima e tenta de novo.
            git push || { git pull --rebase -X theirs origin main && git push; }
          fi
