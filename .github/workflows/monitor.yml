name: monitor-ingressos #teste

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # a cada 10 min, fora dos minutos "redondos" (mais congestionados no GitHub)
  workflow_dispatch:          # permite rodar na mão pela aba Actions

permissions:
  contents: write             # para commitar o state.json

concurrency:
  group: monitor-ingressos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: atualiza estado do monitor"
            git push
          fi
